name: FreeWill
description: >-
  FreeWill is an online estate-planning platform that lets people create legal
  documents for free, including last wills, revocable living trusts (California
  only), advance healthcare directives, financial powers of attorney, and
  beneficiary designations, through a guided questionnaire. It runs a dual model:
  individuals use the tools at no cost, while more than 2,400 nonprofit
  organizations partner with FreeWill for planned-giving and legacy-gift
  features. Related surfaces include the Estately advisor platform and a
  Nonprofit Solutions offering. FreeWill was surfaced as a portfolio company of
  iconiq-capital and qed-investors. Enrichment found no public developer portal,
  OpenAPI, SDK, or API documentation — this profile is a consumer/nonprofit
  company record, not an API producer, with security and legal properties
  captured from the public site.
